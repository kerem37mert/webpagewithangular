<div class="login">
  <div class="login__header">Login StickyNote</div>
  <div class="login__body">
    <app-text-input
      placeholder="username or e-mail"
      label="username or e-mail"
      [required]="true"
      [field]="loginForm.identifier"
    />
    <app-text-input
      label="Password"
      placeholder="password"
      type="password"
      [required]="true"
      [field]="loginForm.password"
    />

    <div class="btn-container">
      <app-button
        type="button"
        text="Login"
        (click)="onSubmit()"
        [showLoading]="isLoading()"
      />
    </div>
  </div>
  <div class="login__footer">
    or
    <a [routerLink]="registerLink">register</a>
  </div>
</div>
