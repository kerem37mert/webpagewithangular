<app-text-input
  placeholder="username or e-mail"
  label="username or e-mail"
  [field]="loginForm.identifier"

/>
<app-text-input
  label="Password"
  placeholder="password"
  type="password"
  [field]="loginForm.password"
/>

<div class="btn-container">
  <app-button
    type="button"
    text="Login"
    (click)="onSubmit()"
  />
</div>
