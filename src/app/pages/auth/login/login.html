<app-text-input
  placeholder="username or e-mail"
  label="username or e-mail"
  [required]="true"
  [field]="loginForm.identifier"

/>
<app-text-input
  label="Password"
  placeholder="password"
  type="password"
  [required]="true"
  [field]="loginForm.password"
/>

<div class="btn-container">
  <app-button
    type="button"
    text="Login"
    (click)="onSubmit()"
    [showLoading]="isLoading()"
  />
</div>

<div class="login-footer">
  or
  <a [routerLink]="registerLink">register</a>
</div>
