<div class="home">
  <div class="top-bar">
    <div class="title">{{ title }}</div>
    <app-button
      type="button"
      text="Yeni +"
      variant="primary"
      size="large"
      (click)="handleNewNote()"
    />
  </div>

  <div class="note-list" cdkDropList (cdkDropListDropped)="drop($event)">
    @for (item of notes; track item) {
      <app-draggable-note [text]="item" (click)="handleOpenNote()" />
    }
  </div>

  <app-edit-note [(isModalOpen)]="isModalOpen" />
</div>
