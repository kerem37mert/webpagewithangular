<div [class]="`text-input text-input--${size()}`">
  @if (label()) {
    <label class="text-input__label">
      @if (required()) {
        <span class="text-input__label__asterix">*</span>
      }
      {{ label() }}
    </label>
  }
  <input
    [placeholder]="placeholder()"
    [type]="type()"
    [formField]="field()!"
  /><!--şimdilik kesin geleceğini varsaydım input required yapaiblieim-->
</div>
